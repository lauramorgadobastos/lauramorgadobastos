name: GitHub Metrics

on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          
          # Mantém apenas o cabeçalho básico e repositórios
          base: header, repositories
          
          # Adiciona o seu nome de forma limpa no topo
          plugin_introduction: yes
          plugin_introduction_title: Laura Morgado

          # Traz o número de commits, pull requests e atividades
          plugin_committer: yes
          plugin_committer_days: 180
          plugin_committer_load: 100

          # Traz a quantidade de estrelas e contadores gerais
          plugin_stars: yes
          plugin_stars_limit: 3

          # Módulo de Linguagens 
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
        

          # Estilização e Cores 
          style_preset: markdown
          extras_css: |
            svg {
              background-color: #0d1117 !important;
              color: #c9d1d9 !important;
            }
            .fill-primary { fill: #6F00BB !important; }
            .text-primary { color: #6F00BB !important; }
            .field { color: #a855f7 !important; }
