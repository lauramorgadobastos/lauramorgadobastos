name: GitHub Metrics

on:
  # Schedule updates (ка a cada 12 horas)
  schedule: [{cron: "0 */12 * * *"}]
  # Permite rodar manualmente na aba Actions
  workflow_dispatch:
  # Executa automaticamente ao dar push no README
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token gerado e salvo nos Secrets
          token: ${{ secrets.METRICS_TOKEN }}

          # Opções de exibição (Estatísticas e Linguagens)
          filename: metrics.svg
          display: classic
          base: header, activity, community, repositories, metadata
          
          # Módulo de Linguagens mais usadas
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # Cores personalizadas (Tema Roxo/Dark)
          config_timezone: America/Sao_Paulo
          config_animated_svg: false
          style_preset: markdown
          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: #30363d;
              --color-calendar-graph-day-L1-bg: #3b1d5a;
              --color-calendar-graph-day-L2-bg: #5d258a;
              --color-calendar-graph-day-L3-bg: #822dc4;
              --color-calendar-graph-day-L4-bg: #a855f7;
            }
            svg {
              background-color: #0d1117 !important;
              color: #c9d1d9 !important;
            }
            rect {
              rx: 4px;
            }
