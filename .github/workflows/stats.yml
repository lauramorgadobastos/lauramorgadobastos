name: GitHub Metrics

on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          
          # Remove o cabeçalho (foto e nome) e foca direto nos dados
          base: "" 
          
          # Módulo de Estatísticas (Commits, PRs, Estrelas)
          plugin_lines: yes
          
          # Módulo de Linguagens mais usadas
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css

          # Cores personalizadas (Tema Roxo/Dark)
          style_preset: markdown
          extras_css: |
            svg {
              background-color: #0d1117 !important;
              color: #c9d1d9 !important;
            }
            .fill-primary { fill: #a855f7 !important; }
            .text-primary { color: #a855f7 !important; }
